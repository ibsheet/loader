    function log(elementId, message) {
      const logEl = document.getElementById(elementId);
      const time = new Date().toLocaleTimeString();
      logEl.innerHTML += `[${time}] ${message}<br>`;
      logEl.scrollTop = logEl.scrollHeight;
      console.log(message);
    }

    // IBSheet 로드
    function doLoadIBSheet() {
      log('sheetLog', 'Loading IBSheet...');
      
      loader
      .once('loaded', evt => {
        // log('sheetLog', '✓ IBSheet loaded successfully');
        console.log('loader ibsheet loaded');
        console.log(evt);
        const target = evt.target
        console.log(target);
        console.log('ibsheet loaded!')
        if (target.alias === 'ibsheet') {
          IBSheet = loader.getIBSheetStatic()
          console.log('IBSheet Static :');
          console.log(IBSheet);
        }
      })
      .load({
        name: 'ibsheet',
        baseUrl: '/sheet',
        locales: ['ko'],
        plugins: ['dialog', 'common', 'excel'],
        // dependentUrls: [
        //   // 추가 의존성 파일이 있다면 여기에
        // ],

      })

      //   log('sheetLog', '✓ IBSheet loaded successfully');
      // }).catch(err => {
      //   log('sheetLog', '✗ Error loading IBSheet: ' + err.message);
      // });
    }

    // IBSheet 생성
    function doCreateSheet() {
      if (!window.IBSheet) {
        log('sheetLog', '✗ IBSheet not loaded yet');
        return;
      }

      log('sheetLog', 'Creating sheet...');
      
      loader.createSheet({
        id: 'sheet',
        el: 'sheetContainer',
        options: {
          Cfg: {
            SearchMode: 2,
            HeaderMerge: 3
          },
          Cols: [
            { Header: 'ID', Name: 'id', Type: 'Text', Width: 80 },
            { Header: 'Name', Name: 'name', Type: 'Text', Width: 150 },
            { Header: 'Age', Name: 'age', Type: 'Int', Width: 80 }
          ]
        },
        data: [
          { id: '1', name: 'John', age: 25 },
          { id: '2', name: 'Jane', age: 30 },
          { id: '3', name: 'Bob', age: 35 }
        ]
      }).then(sheet => {
        sheetInstance = sheet;
        log('sheetLog', '✓ Sheet created successfully');
      }).catch(err => {
        log('sheetLog', '✗ Error creating sheet: ' + err.message);
      });
    }

    function doDeleteSheet() {
      if (!sheetInstance) {
        log('sheetLog', '✗ No sheet instance to delete');
        return;
      } else {
        console.log('sheetInstance :', sheetInstance);
        let sheetId = sheetInstance.id;
        loader.removeSheet(sheetId);
        sheetInstance = null;
        console.log('Sheet removed:', sheetInstance);
      }
    }
